name: Auto-Update Job Openings

on:
  schedule:
    # Run every day at 8 AM IST (2:30 AM UTC)
    - cron: '30 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 feedparser
    
    - name: Run job scraper script
      run: python scripts/fetch-job-updates.py
    
    - name: Check for changes
      id: changes
      run: |
        git diff --quiet jobs-openings-2026.md || echo "changed=true" >> $GITHUB_OUTPUT
    
    - name: Commit and push changes
      if: steps.changes.outputs.changed == 'true'
      run: |
        git config --global user.name "Job Update Bot"
        git config --global user.email "bot@placement-dashboard.com"
        git add jobs-openings-2026.md
        git commit -m "Auto-update: Fetch latest job openings from official sources - $(date +%Y-%m-%d)"
        git push
    
    - name: Update website
      if: steps.changes.outputs.changed == 'true'
      run: echo "Dashboard automatically updated with latest job openings"

# Trigger GitHub Pages rebuild
  pages:
    needs: update-jobs
    runs-on: ubuntu-latest
    steps:
    - name: Trigger GitHub Pages
      run: |
        echo "GitHub Pages will automatically rebuild with the latest changes"
