name: Auto Mail Latest Job

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch: {}

jobs:
  send-latest-job-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd autoMail
          npm init -y
          npm install node-fetch@2

      - name: Build email content
        id: build
        run: |
          cd autoMail
          node -e "
          const { getLatestJob } = require('./fetchLatestJob');
          (async () => {
            const data = await getLatestJob();
            const fs = require('fs');
            fs.writeFileSync('subject.txt', data.subject);
            fs.writeFileSync('bodyText.txt', data.bodyText);
            fs.writeFileSync('bodyHtml.html', data.bodyHtml);
          })();
          "

      - name: Read subject/body into outputs
        id: read
        run: |
          cd autoMail
          echo "subject<<EOF" >> $GITHUB_OUTPUT
          cat subject.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "bodyText<<EOF" >> $GITHUB_OUTPUT
          cat bodyText.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "bodyHtml<<EOF" >> $GITHUB_OUTPUT
          cat bodyHtml.html >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.read.outputs.subject }}
          to: "Mamaparadisekimml@gmail.com"
          from: ${{ secrets.MAIL_USERNAME }}
          body: ${{ steps.read.outputs.bodyText }}
          html_body: ${{ steps.read.outputs.bodyHtml }}
